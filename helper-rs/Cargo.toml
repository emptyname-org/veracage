[package]
name = "veracage-helper"
version = "0.6.0"
edition = "2021"
rust-version = "1.63"   # Debian 12 (bookworm) floor
description = "Veracage privileged mount/dismount helper (root via polkit)"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "veracage-helper"
path = "src/main.rs"

# Pinned to versions that build on Debian 12's rustc 1.63 (newer libc requires
# rustc >= 1.65). Bump these once the toolchain floor moves up.
[dependencies]
libc = "=0.2.169"
sha2 = "=0.10.8"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
