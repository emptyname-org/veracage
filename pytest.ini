[pytest]
testpaths = tests/unit
pythonpath = src
addopts = -ra --strict-markers
# No markers are declared: nothing uses one. `testpaths` above is what keeps the
# integration tests out of a default run, and `tests/integration/
# test_helper_security.py` gates itself on the built helper with a `skipif`.
# --strict-markers stays, so a mark added without declaring it here is an error
# rather than a silent typo.
